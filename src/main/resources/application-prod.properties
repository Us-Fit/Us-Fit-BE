# Production Profile - MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/usfit_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:your_mysql_password}

# JPA/Hibernate properties for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# MySQL specific settings
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
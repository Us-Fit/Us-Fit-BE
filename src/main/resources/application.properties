#RDS setting
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/UsFit?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA setting
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Kakao OAuth
kakao.oauth.client-id=${KAKAO_CLIENT_ID:}
kakao.oauth.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.oauth.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/oauth2/callback/kakao}
kakao.oauth.token-uri=${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
kakao.oauth.authorize-uri=${KAKAO_AUTHORIZE_URI:https://kauth.kakao.com/oauth/authorize}
kakao.oauth.user-info-uri=${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}

# JPA batch
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-validity-seconds=${JWT_ACCESS_TTL}

# --- Multipart (CSV ??? ??) ---
spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=80MB

# S3 setting
cloud.aws.s3.bucket=${AWS_S3_BUCKET:usfit-s3-bucket}
cloud.aws.s3.region=${AWS_REGION:ap-southeast-2}

# AWS 설정
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
spring.application.name=UsFit

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/usfit?serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA setting
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA batch
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true

# --- Multipart (CSV ??? ??) ---
spring.servlet.multipart.max-file-size=80MB
spring.servlet.multipart.max-request-size=80MB


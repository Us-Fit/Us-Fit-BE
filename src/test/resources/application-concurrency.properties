# 동시성 통합 테스트 전용 (DB 접속 정보는 ConcurrencyTestSupport의 @DynamicPropertySource가 컨테이너 값으로 주입)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 스레드 수(기본 20)보다 커야 모든 요청이 커넥션 대기 없이 동시에 DB에 도달함
spring.datasource.hikari.maximum-pool-size=40

jwt.secret=Y29uY3VycmVuY3ktdGVzdC1zZWNyZXQta2V5LTAxMjM0NTY3ODlhYmNkZWY=
jwt.access-token-validity-seconds=3600
cloud.aws.credentials.access-key=test
cloud.aws.credentials.secret-key=test
kakao.oauth.client-secret=test

# 의도적으로 발생시키는 UNIQUE 위반 로그가 리포트를 가리지 않도록
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.tool.schema=ERROR

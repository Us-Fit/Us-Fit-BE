name: Deploy to EC2

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 1) jar들을 통째로 EC2 app 폴더로 복사
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/app/"

      # 2) 실행 가능한 jar만 골라 usfit.jar로 복사 후 systemd 재시작
      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app

            # 기존 파일 제거
            rm -f usfit.jar

            # plain 제외 jar만 선택
            JAR_PATH=$(ls build/libs/*SNAPSHOT.jar | grep -v plain | head -n 1)
            echo "Using JAR: $JAR_PATH"

            # usfit.jar로 복사
            cp "$JAR_PATH" usfit.jar

            sudo systemctl daemon-reload
            sudo systemctl restart usfit
            sudo systemctl status usfit --no-pager || true

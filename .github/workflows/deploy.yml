name: Deploy to EC2

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 1) jar를 EC2의 app 폴더로만 복사 (폴더로 취급)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/app/"   # <= 슬래시! 폴더로 복사

      # 2) EC2에서 jar 파일 이름을 usfit.jar로 맞추고 서비스 재시작
      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets_EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app

            # 기존 usfit.jar 파일/폴더 있으면 삭제
            rm -rf usfit.jar

            # 새로 복사된 jar 하나를 usfit.jar로 이름 변경
            mv build/libs/*.jar usfit.jar

            sudo systemctl daemon-reload
            sudo systemctl restart usfit
            sudo systemctl status usfit --no-pager || true

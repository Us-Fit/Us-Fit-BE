name: "🚀 Feature Request"
description: "기능 개발, 리팩터링, 버그 등 모든 작업 공통 템플릿"
title: "[feat]: "
labels:
  - tech-debt
body:
  - type: dropdown
    id: type
    attributes:
      label: 작업 유형 선택
      options:
        - feat
        - fix
        - refactor
        - chore
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: 작업 제목
      placeholder: "예: [refactor][structure] config 패키지 이동"

  - type: textarea
    id: background
    attributes:
      label: 배경

  - type: textarea
    id: goal
    attributes:
      label: 목표

  - type: checkboxes
    id: ac
    attributes:
      label: Acceptance Criteria (DoD)
      options:
        - label: 기능 구현 완료
        - label: 테스트 통과
        - label: 코드 리뷰 완료
        - label: 문서 업데이트 완료

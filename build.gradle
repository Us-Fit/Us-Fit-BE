plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app.usfit'
version = '0.0.1-SNAPSHOT'
description = 'Us Fit project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Spring Boot 기본(1.18.40) 대신 최신 Lombok 사용
ext['lombok.version'] = '1.18.48'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 동시성 통합 테스트용 MySQL 컨테이너 (Docker 필요)
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	
	//Oauth
	implementation "org.springframework.boot:spring-boot-starter-oauth2-client"

	//swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// 검증 라이브러리
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	//JWT setting
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
  	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
  	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	//JPA setting
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	//MySQL Driver
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Lombok (auto Getter/Setter....)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// CSV parsing
	implementation 'org.apache.commons:commons-csv:1.11.0'

    //S3
    implementation 'software.amazon.awssdk:s3:2.25.19'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'concurrency'
	}
}

// 동시성 측정: ./gradlew concurrencyTest [-Pthreads=20 -Ptrials=30]
// 결과 리포트: build/reports/concurrency/*.md
tasks.register('concurrencyTest', Test) {
	description = 'Runs MySQL(Testcontainers) concurrency experiments and writes reports.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'concurrency'
	}
	systemProperty 'concurrency.threads', project.findProperty('threads') ?: '20'
	systemProperty 'concurrency.trials', project.findProperty('trials') ?: '30'
	systemProperty 'concurrency.reportDir', layout.buildDirectory.dir('reports/concurrency').get().asFile.absolutePath
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
		events 'passed', 'failed'
	}
}
